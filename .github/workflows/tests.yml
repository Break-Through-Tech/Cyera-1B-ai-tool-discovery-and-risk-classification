name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core tests (must pass)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: pip install -r .github/ci-requirements.txt

      - name: Prepared category data matches its manifest (byte-exact)
        run: >
          python category_training/train_categories.py
          --prepared data/processed/category/category_preparation_v1
          --out models/categories/ci-check --validate-only

      - name: Unit tests
        run: >
          python -m unittest -v
          tests.test_apply_conflict_review
          tests.test_component3_pipeline
          tests.test_component4_pipeline
          tests.test_conflict_review
          tests.test_dashboard_data
          tests.test_full_classification
          tests.test_governance
          tests.test_governance_evaluation
          tests.test_governance_evidence
          tests.test_governance_repair
          tests.test_prepare_classification
          tests.test_source_membership
          tests.test_vendor_reconciliation

  known-broken:
    name: Known-broken tests (informational)
    # These need trained model files that are not in Git, or cover the older
    # report.py/catalog.py interface. Move a module into `core` once it passes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/ci-requirements.txt
      - run: pip install -r .github/ci-requirements.txt
      - run: >
          python -m unittest
          tests.test_backend_release
          tests.test_baseline
          tests.test_corrected_full_training
          tests.test_discovery
          tests.test_embeddings
